[workspace]
resolver = "3"
members = [
  "crates/notes-blob",
  "crates/notes-core",
  "crates/notes-ai",
  "crates/notes-import",
  "crates/notes-markdown",
  "crates/notes-protocol",
  "crates/notes-sync",
  "plugins/tauri-plugin-mobile-system",
  "server",
  "src-tauri",
  "crates/ink-format",
  "tools/ink-storage-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["okhsunrog <me@okhsunrog.dev>"]
repository = "https://github.com/okhsunrog/tangleaf"
homepage = "https://github.com/okhsunrog/tangleaf"

[workspace.dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
eventsource-stream = "0.2.3"
futures = "0.3.34"
fastembed = "7.1.1"
llm-relay = { git = "https://github.com/okhsunrog/llm-relay", rev = "8f9f1647ce199e2158b9d7e5cc88d5833d5d1260", version = "1.0.1", features = [
  "embeddings",
  "rig",
  "streaming",
] }
notes-ai = { path = "crates/notes-ai" }
notes-blob = { path = "crates/notes-blob" }
notes-core = { path = "crates/notes-core" }
notes-import = { path = "crates/notes-import" }
notes-markdown = { path = "crates/notes-markdown" }
notes-protocol = { path = "crates/notes-protocol" }
notes-sync = { path = "crates/notes-sync" }
proptest = "1.12.0"
pulldown-cmark = { version = "=0.13.4", default-features = false }
reqwest = { version = "0.13.5", default-features = false }
rig = { package = "rig-core", version = "0.44.0", features = ["reqwest"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "uuid", "trace"] }
rusqlite_migration = "2.6.0"
rustix = { version = "1.1.5", features = ["fs"] }
rust-stemmers = "1.2.0"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json", "url", "uuid"] }
specta-typescript = "0.0.12"
sha2 = "0.11.1"
subtle = "2.6.1"
sqlite-vec = "0.1.9"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
  "connect",
  "rustls-tls-webpki-roots",
] }
tokio-util = { version = "0.7.20", features = ["io", "rt"] }
toml = "1.1.8"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.26"
uuid = { version = "1.28.0", features = ["v4", "v5", "v7", "serde"] }
url = { version = "2.5.8", features = ["serde"] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
